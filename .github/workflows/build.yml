name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: ${{ matrix.arch }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]
        variant: [ default, private-testnet ]
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
            filearch: x86-64
          - os: ubuntu-24.04-arm
            arch: linux-arm64
            filearch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set short commit hash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${sha::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      - name: Restore ccache in the builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "ccache": "/ccache"
            }

      - name: Build monero-daemon-rpc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-daemon-rpc
          tags: monero-daemon-rpc:ci
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}-daemon
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}-{1}-daemon', matrix.arch, matrix.variant) || '' }}

      - name: Test monero-daemon-rpc
        run: ./bin/smoke_test.sh monero-daemon-rpc monero-daemon-rpc:ci ${{ matrix.variant }}

      - name: Build monero-wallet-rpc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-wallet-rpc
          tags: monero-wallet-rpc:ci
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}-wallet
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}-{1}-wallet', matrix.arch, matrix.variant) || '' }}

      - name: Test monero-wallet-rpc
        run: ./bin/smoke_test.sh monero-wallet-rpc monero-wallet-rpc:ci ${{ matrix.variant }}

      - name: Extract binaries
        run: |
          mkdir binaries
          for name in monerod monero-wallet-rpc; do
            image=monero-daemon-rpc:ci
            [ "$name" = monerod ] || image=monero-wallet-rpc:ci
            docker create --name "extract-$name" "$image" > /dev/null
            docker cp "extract-$name:/usr/local/bin/$name" "binaries/$name"
          done

      - name: Verify binaries
        run: |
          cd binaries
          for bin in monerod monero-wallet-rpc; do
            file "$bin"
            file "$bin" | grep -q '${{ matrix.filearch }}' || { echo "wrong architecture: $(file "$bin")"; exit 1; }
            file "$bin" | grep -qE 'statically linked|static-pie linked' || { echo "$bin is not statically linked"; exit 1; }
            ! strings "$bin" | grep -qE 'INPUTRC|inputrc' || { echo "$bin contains readline"; exit 1; }
            memsz=$(readelf -lW "$bin" | awk '/GNU_STACK/ {print $6}')
            [ $((memsz)) -ge 8388608 ] || { echo "$bin has a thread stack of $memsz bytes"; exit 1; }
          done

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monero-rpc-${{ matrix.arch }}-${{ matrix.variant }}-${{ env.SHORT_SHA }}
          path: |
            binaries/monerod
            binaries/monero-wallet-rpc
