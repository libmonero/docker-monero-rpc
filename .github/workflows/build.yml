name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: ${{ matrix.arch }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]
        variant: [ default, private-testnet ]
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
            filearch: x86-64
          - os: ubuntu-24.04-arm
            arch: linux-arm64
            filearch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Initialize submodules
        run: ./bin/update_submodules.sh

      - name: Set short commit hash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${sha::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      - name: Restore ccache in the builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "ccache": "/ccache"
            }

      - name: Build monero-daemon-rpc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-daemon-rpc
          tags: monero-daemon-rpc:ci
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}-daemon
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}-{1}-daemon', matrix.arch, matrix.variant) || '' }}

      - name: Build monero-wallet-rpc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-wallet-rpc
          tags: monero-wallet-rpc:ci
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}-wallet
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}-{1}-wallet', matrix.arch, matrix.variant) || '' }}

      - name: Build monero-wallet-light
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-wallet-light
          tags: monero-wallet-light:ci
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}-wallet-light
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}-{1}-wallet-light', matrix.arch, matrix.variant) || '' }}

      - name: Extract binaries
        run: |
          ./bin/extract_binaries.sh binaries monero-daemon-rpc:ci monerod
          ./bin/extract_binaries.sh binaries monero-wallet-rpc:ci monero-wallet-rpc
          ./bin/extract_binaries.sh binaries monero-wallet-light:ci monero-lws-daemon monero-lws-admin

      - name: Verify binaries
        run: ./bin/verify_binaries.sh binaries ${{ matrix.filearch }}

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monero-rpc-${{ matrix.arch }}-${{ matrix.variant }}-${{ env.SHORT_SHA }}
          path: |
            binaries/monerod
            binaries/monero-wallet-rpc
            binaries/monero-lws-daemon
            binaries/monero-lws-admin

      # Test runs on the images, they are compressed already
      - name: Save the images
        run: ./bin/save_images.sh images monero-daemon-rpc:ci monero-wallet-rpc:ci monero-wallet-light:ci

      - name: Upload the images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.arch }}-${{ matrix.variant }}-${{ env.SHORT_SHA }}
          path: images/*.tar.zst
          compression-level: 0
          retention-days: 2
