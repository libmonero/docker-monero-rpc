name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # static musl build, the same environment as the docker images
  BUILD_IMAGE: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6

jobs:
  linux:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
            filearch: x86-64
          - os: ubuntu-24.04-arm
            arch: linux-arm64
            filearch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set short commit hash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${sha::7}" >> "$GITHUB_ENV"

      - name: Set expected Monero version
        run: |
          # same tag logic as the monero-project GitVersion.cmake
          cd external/monero-project
          version=$(sed -n 's/^#define DEF_MONERO_VERSION "\(.*\)"$/\1/p' src/version.cpp.in)
          tag=$(git rev-parse --short=9 HEAD)
          test -z "$(git tag -l --points-at HEAD)" || tag=release
          echo "MONERO_VERSION=v${version}-${tag}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      - name: Start build container
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          docker run -d --name build -v "$PWD:/src" -v "$RUNNER_TEMP/ccache:/ccache" -w /src \
            -e NPROC=3 -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=1G -e CCACHE_COMPRESS=1 "$BUILD_IMAGE" sleep infinity
          docker exec build apk add --no-cache bash git
          docker exec build git config --global --add safe.directory "*"

      - name: Install dependencies
        run: |
          docker exec build ./bin/install_dependencies.sh
          docker exec build ccache --zero-stats

      - name: Verify dependencies
        run: |
          # record versions of the distro libraries that get statically linked into the shipped binaries
          docker exec build sh -c "apk list -I | grep -E '^(libsodium-static|openssl-libs-static|boost1\.[0-9]+-static|readline-static|ncurses-static)-[0-9]'"
          docker exec build sh -c 'for lib in zmq unbound expat sodium ssl crypto readline ncursesw miniupnpc usb-1.0 udev boost_system boost_filesystem boost_thread boost_serialization boost_program_options boost_regex boost_chrono boost_date_time; do
            test -f "/usr/lib/lib$lib.a" || { echo "missing static library: lib$lib.a"; exit 1; }
          done'

      - name: Build common libraries
        run: docker exec build ./bin/build_monero_rpc.sh cryptonote_core cryptonote_protocol rpc_base

      - name: Build monerod
        run: |
          docker exec build ./bin/build_monero_rpc.sh daemon
          docker exec build strip --strip-unneeded external/monero-project/build/release/bin/monerod

      - name: Verify monerod
        run: |
          cd external/monero-project/build/release/bin
          file monerod
          file monerod | grep -q '${{ matrix.filearch }}' || { echo "wrong architecture: $(file monerod)"; exit 1; }
          file monerod | grep -qE 'statically linked|static-pie linked' || { echo "monerod is not statically linked"; exit 1; }
          version=$(docker run --rm -v "$PWD:/bin-src:ro" "$BUILD_IMAGE" /bin-src/monerod --version)
          echo "$version"
          echo "$version" | grep -qF "($MONERO_VERSION)" || { echo "unexpected version, expected $MONERO_VERSION"; exit 1; }

      - name: Build monero-wallet-rpc
        run: |
          docker exec build ./bin/build_monero_rpc.sh wallet_rpc_server
          docker exec build strip --strip-unneeded external/monero-project/build/release/bin/monero-wallet-rpc

      - name: Verify monero-wallet-rpc
        run: |
          cd external/monero-project/build/release/bin
          file monero-wallet-rpc
          file monero-wallet-rpc | grep -q '${{ matrix.filearch }}' || { echo "wrong architecture: $(file monero-wallet-rpc)"; exit 1; }
          file monero-wallet-rpc | grep -qE 'statically linked|static-pie linked' || { echo "monero-wallet-rpc is not statically linked"; exit 1; }
          version=$(docker run --rm -v "$PWD:/bin-src:ro" "$BUILD_IMAGE" /bin-src/monero-wallet-rpc --version)
          echo "$version"
          echo "$version" | grep -qF "($MONERO_VERSION)" || { echo "unexpected version, expected $MONERO_VERSION"; exit 1; }

      - name: Show ccache statistics
        if: always()
        run: docker exec build ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.arch }}-${{ github.run_id }}

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: monero-rpc-${{ matrix.arch }}-${{ env.SHORT_SHA }}
          path: |
            external/monero-project/build/release/bin/monerod
            external/monero-project/build/release/bin/monero-wallet-rpc
