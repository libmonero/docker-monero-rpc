name: Cache cleanup

on:
  pull_request_target:
    types: [ closed ]

permissions:
  actions: write

jobs:
  cleanup:
    name: cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the caches of the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id' | xargs -r -n1 gh cache delete
