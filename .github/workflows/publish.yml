name: Publish

# images of main as master, the ones of a release are published by Release, which calls this
on:
  push:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

# not github.workflow, which is the one of the caller in a release and would be the same group
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  check:
    name: check
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      monero_version: ${{ steps.version.outputs.monero_version }}
      monero_commit: ${{ steps.version.outputs.monero_commit }}
      lws_version: ${{ steps.version.outputs.lws_version }}
      lws_commit: ${{ steps.version.outputs.lws_commit }}
      tags: ${{ steps.version.outputs.tags }}
      latest: ${{ steps.version.outputs.latest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Check the tag against monero-project
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          monero_version=$(./bin/monero_version.sh)
          version=master
          tags=master
          latest=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){3}-[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not a monero version and a release number"; exit 1; }
              [ "${monero_version%-*}" = "${GITHUB_REF_NAME%-*}" ] || { echo "tag $GITHUB_REF_NAME does not match monero-project $monero_version"; exit 1; }
              # the tag of the monero version moves to the highest release, latest to the highest version
              version=${GITHUB_REF_NAME#v}
              tags=$GITHUB_REF_NAME
              releases=$(git ls-remote --tags --refs origin "refs/tags/${GITHUB_REF_NAME%-*}-*" | sed 's|.*refs/tags/||' | sort -V)
              [ "$(tail -1 <<< "$releases")" != "$GITHUB_REF_NAME" ] || tags="$tags ${GITHUB_REF_NAME%-*}"
              highest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
              [ "$highest" != "$GITHUB_REF_NAME" ] || latest=true
          fi
          {
              echo "version=$version"
              echo "monero_version=$monero_version"
              echo "monero_commit=$(git -C external/monero-project rev-parse HEAD)"
              echo "lws_version=$(sed -n 's/.*id\[\] = "\(.*\)";/\1/p' external/monero-lws/src/lws_version.h.in)"
              echo "lws_commit=$(git -C external/monero-lws rev-parse HEAD)"
              echo "tags=$tags"
              echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      # the commit has to pass Build and Test, which waits for Build
      - name: Wait for the tests of the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./bin/wait_for_run.sh test.yml "$GITHUB_SHA" push

  build:
    name: ${{ matrix.arch }} ${{ matrix.variant }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]
        variant: [ default, private-testnet ]
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Initialize submodules
        run: ./bin/update_submodules.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push monero-daemon-rpc
        id: monero-daemon-rpc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-daemon-rpc
          build-args: |
            VARIANT=${{ matrix.variant }}
            NPROC=3
          outputs: type=image,"name=${{ env.REGISTRY }}/monero-daemon-rpc",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.libmonero.monero-version=${{ needs.check.outputs.monero_version }}
            io.libmonero.monero-commit=${{ needs.check.outputs.monero_commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}-daemon

      - name: Build and push monero-wallet-rpc
        id: monero-wallet-rpc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-wallet-rpc
          build-args: |
            VARIANT=${{ matrix.variant }}
            NPROC=3
          outputs: type=image,"name=${{ env.REGISTRY }}/monero-wallet-rpc",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.libmonero.monero-version=${{ needs.check.outputs.monero_version }}
            io.libmonero.monero-commit=${{ needs.check.outputs.monero_commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}-wallet

      - name: Build and push monero-wallet-light
        id: monero-wallet-light
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-wallet-light
          build-args: |
            VARIANT=${{ matrix.variant }}
            NPROC=3
          outputs: type=image,"name=${{ env.REGISTRY }}/monero-wallet-light",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.libmonero.monero-version=${{ needs.check.outputs.monero_version }}
            io.libmonero.monero-commit=${{ needs.check.outputs.monero_commit }}
            io.libmonero.lws-version=${{ needs.check.outputs.lws_version }}
            io.libmonero.lws-commit=${{ needs.check.outputs.lws_commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}-wallet-light

      - name: Test pushed images
        run: |
          ./bin/smoke_test.sh monero-daemon-rpc "$REGISTRY/monero-daemon-rpc@$DAEMON_DIGEST" "$VARIANT"
          ./bin/smoke_test.sh monero-wallet-rpc "$REGISTRY/monero-wallet-rpc@$WALLET_DIGEST" "$VARIANT"
          DAEMON_IMAGE="$REGISTRY/monero-daemon-rpc@$DAEMON_DIGEST" ./bin/smoke_test.sh monero-wallet-light "$REGISTRY/monero-wallet-light@$LIGHT_DIGEST" "$VARIANT"
        env:
          VARIANT: ${{ matrix.variant }}
          DAEMON_DIGEST: ${{ steps.monero-daemon-rpc.outputs.digest }}
          WALLET_DIGEST: ${{ steps.monero-wallet-rpc.outputs.digest }}
          LIGHT_DIGEST: ${{ steps.monero-wallet-light.outputs.digest }}

      - name: Export digests
        run: |
          mkdir -p digests/monero-daemon-rpc digests/monero-wallet-rpc digests/monero-wallet-light
          touch "digests/monero-daemon-rpc/${DAEMON_DIGEST#sha256:}"
          touch "digests/monero-wallet-rpc/${WALLET_DIGEST#sha256:}"
          touch "digests/monero-wallet-light/${LIGHT_DIGEST#sha256:}"
        env:
          DAEMON_DIGEST: ${{ steps.monero-daemon-rpc.outputs.digest }}
          WALLET_DIGEST: ${{ steps.monero-wallet-rpc.outputs.digest }}
          LIGHT_DIGEST: ${{ steps.monero-wallet-light.outputs.digest }}

      - name: Upload digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: publish ${{ matrix.image }} ${{ matrix.variant }}
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        variant: [ default, private-testnet ]
        image: [ monero-daemon-rpc, monero-wallet-rpc, monero-wallet-light ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the tags
        id: tags
        run: |
          list=$(./bin/image_tags.sh "$VARIANT" "$TAGS" "$LATEST")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "first=${list%% *}" >> "$GITHUB_OUTPUT"
        env:
          VARIANT: ${{ matrix.variant }}
          TAGS: ${{ needs.check.outputs.tags }}
          LATEST: ${{ needs.check.outputs.latest }}

      - name: Create the manifest
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$REGISTRY/$IMAGE:$tag"); done
          # shellcheck disable=SC2046
          docker buildx imagetools create "${args[@]}" \
            $(printf "$REGISTRY/$IMAGE@sha256:%s " $(ls "digests/$IMAGE"))
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.tags.outputs.list }}

      # master is only reported, a release has to be clean
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.repository_owner }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.tags.outputs.first }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ github.ref_type == 'tag' && '1' || '0' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the manifest
        run: |
          digest=$(docker buildx imagetools inspect "$REGISTRY/$IMAGE:$FIRST" --format '{{.Manifest.Digest}}')
          cosign sign --yes "$REGISTRY/$IMAGE@$digest"
        env:
          IMAGE: ${{ matrix.image }}
          FIRST: ${{ steps.tags.outputs.first }}
