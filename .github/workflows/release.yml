name: Release

# a v* tag publishes the images and drafts the GitHub release with the binaries
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    name: publish
    if: ${{ !github.event.repository.fork }}
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml

  github-release:
    name: release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package binaries
        run: ./bin/package_release.sh "$REGISTRY" "$GITHUB_REF_NAME"

      - name: Attach archives to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: monero-rpc-${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          draft: true
          body: |
            ```
            docker pull ${{ env.REGISTRY }}/monero-daemon-rpc:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/monero-wallet-rpc:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/monero-wallet-light:${{ github.ref_name }}
            ```
