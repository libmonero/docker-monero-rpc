name: Release

# a v* tag publishes the images and drafts the GitHub release with the binaries
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    name: publish
    if: ${{ !github.event.repository.fork }}
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml

  github-release:
    name: release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package binaries
        run: ./bin/package_release.sh "$REGISTRY" "$GITHUB_REF_NAME"

      - name: Attach archives to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: monero-rpc-${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          draft: true
          body: |
            ```
            docker pull ${{ env.REGISTRY }}/monero-daemon-rpc:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/monero-wallet-rpc:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/monero-wallet-light:${{ github.ref_name }}
            ```
