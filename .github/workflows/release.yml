name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      monero_version: ${{ steps.version.outputs.monero_version }}
      monero_commit: ${{ steps.version.outputs.monero_commit }}
      latest: ${{ steps.version.outputs.latest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true

      - name: Check tag against monero-project
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){3}$ ]] || { echo "tag $GITHUB_REF_NAME is not a monero version"; exit 1; }
          monero_version=$(./bin/monero_version.sh)
          [ "${monero_version%-*}" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match monero-project $monero_version"; exit 1; }
          highest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "monero_version=$monero_version"
            echo "monero_commit=$(git -C external/monero-project rev-parse HEAD)"
            echo "latest=$([ "$highest" = "$GITHUB_REF_NAME" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push monero-daemon-rpc
        id: monero-daemon-rpc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-daemon-rpc
          build-args: NPROC=3
          outputs: type=image,"name=${{ env.REGISTRY }}/monero-daemon-rpc",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=monero-daemon-rpc
            org.opencontainers.image.description=monerod built from woodser/monero
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT AND BSD-3-Clause
            io.libmonero.monero-version=${{ needs.check.outputs.monero_version }}
            io.libmonero.monero-commit=${{ needs.check.outputs.monero_commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Build and push monero-wallet-rpc
        id: monero-wallet-rpc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: monero-wallet-rpc
          build-args: NPROC=3
          outputs: type=image,"name=${{ env.REGISTRY }}/monero-wallet-rpc",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=monero-wallet-rpc
            org.opencontainers.image.description=monero-wallet-rpc built from woodser/monero
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT AND BSD-3-Clause
            io.libmonero.monero-version=${{ needs.check.outputs.monero_version }}
            io.libmonero.monero-commit=${{ needs.check.outputs.monero_commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digests
        run: |
          mkdir -p digests/monero-daemon-rpc digests/monero-wallet-rpc
          touch "digests/monero-daemon-rpc/${DAEMON_DIGEST#sha256:}"
          touch "digests/monero-wallet-rpc/${WALLET_DIGEST#sha256:}"
        env:
          DAEMON_DIGEST: ${{ steps.monero-daemon-rpc.outputs.digest }}
          WALLET_DIGEST: ${{ steps.monero-wallet-rpc.outputs.digest }}

      - name: Upload digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: publish
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifests
        run: |
          for image in monero-daemon-rpc monero-wallet-rpc; do
            # shellcheck disable=SC2046
            docker buildx imagetools create -t "$REGISTRY/$image:$VERSION" \
              $(printf "$REGISTRY/$image@sha256:%s " $(ls "digests/$image"))
          done
        env:
          VERSION: ${{ needs.check.outputs.version }}

      - name: Scan monero-daemon-rpc
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.repository_owner }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/monero-daemon-rpc:${{ needs.check.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan monero-wallet-rpc
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.repository_owner }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/monero-wallet-rpc:${{ needs.check.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Tag latest
        if: needs.check.outputs.latest == 'true'
        run: |
          for image in monero-daemon-rpc monero-wallet-rpc; do
            docker buildx imagetools create -t "$REGISTRY/$image:latest" "$REGISTRY/$image:$VERSION"
          done
        env:
          VERSION: ${{ needs.check.outputs.version }}

  release:
    name: release
    needs: [check, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package binaries
        run: |
          mkdir release
          for platform in linux/amd64:linux-x86_64 linux/arm64:linux-arm64; do
            arch=${platform#*:}
            staging="monero-rpc-$GITHUB_REF_NAME-$arch"
            mkdir "$staging"
            for pair in monero-daemon-rpc:monerod monero-wallet-rpc:monero-wallet-rpc; do
              id=$(docker create --platform "${platform%:*}" "$REGISTRY/${pair%:*}:$VERSION")
              docker cp "$id:/usr/local/bin/${pair#*:}" "$staging/"
              docker cp "$id:/usr/share/licenses/monero-project/LICENSE" "$staging/LICENSE"
              docker rm "$id" > /dev/null
            done
            tar czf "release/$staging.tar.gz" "$staging"
          done
          cd release
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
        env:
          VERSION: ${{ needs.check.outputs.version }}

      - name: Attach archives to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: monero-rpc-${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          draft: true
          body: |
            ```
            docker pull ${{ env.REGISTRY }}/monero-daemon-rpc:${{ needs.check.outputs.version }}
            docker pull ${{ env.REGISTRY }}/monero-wallet-rpc:${{ needs.check.outputs.version }}
            ```
