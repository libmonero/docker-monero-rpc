name: Test

on:
  workflow_call:
    inputs:
      tests:
        type: string
        default: ''
      run-id:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tests:
        description: Functional tests to run, separated by spaces, or all
        default: daemon_info blockchain transfer uri wallet
      run-id:
        description: Build run to take the binaries from
        required: true

permissions:
  contents: read
  actions: read

jobs:
  functional:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: monero-rpc-${{ matrix.arch }}-default-*
          merge-multiple: true
          path: build/binaries
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Run functional tests
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          read -ra list <<< "$TESTS"
          [ "${list[*]}" != all ] || list=(address_book bans blockchain cold_signing daemon_info get_output_distribution integrated_address mining multisig p2p proofs sign_message transfer txpool uri validate_address wallet)
          ./bin/functional_tests.sh build/binaries "${list[@]}"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-tests-logs-${{ matrix.arch }}
          path: build/functional/tests/functional_tests/*.log
          if-no-files-found: ignore
