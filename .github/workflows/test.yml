name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tests:
        description: Functional tests to run, separated by spaces, all but a few if empty
      run-id:
        description: Build run to take the binaries from
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wait:
    name: wait for build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      run-id: ${{ steps.build.outputs.run-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the build of the same commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          id=$(./bin/wait_for_run.sh build.yml "$SHA" "$GITHUB_EVENT_NAME")
          echo "run-id=$id" >> "$GITHUB_OUTPUT"

  functional:
    name: ${{ matrix.arch }}
    needs: wait
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: monero-rpc-${{ matrix.arch }}-default-*
          merge-multiple: true
          path: build/binaries
          run-id: ${{ inputs.run-id || needs.wait.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Run functional tests
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          read -ra list <<< "$TESTS"
          ./bin/functional_tests.sh build/binaries "${list[@]}"

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-tests-logs-${{ matrix.arch }}
          path: build/functional/tests/functional_tests/*.log
          if-no-files-found: ignore

  smoke:
    name: smoke ${{ matrix.arch }} ${{ matrix.variant }}
    needs: wait
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # the smoke tests save the logs of their containers here
      LOGS_DIR: build/smoke-tests

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]
        variant: [ default, private-testnet ]
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-${{ matrix.arch }}-${{ matrix.variant }}-*
          merge-multiple: true
          path: build/images
          run-id: ${{ inputs.run-id || needs.wait.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Load the images
        run: ./bin/load_images.sh build/images

      - name: Test monero-daemon-rpc
        run: ./bin/smoke_test.sh monero-daemon-rpc monero-daemon-rpc:ci ${{ matrix.variant }}

      - name: Test monero-wallet-rpc
        run: ./bin/smoke_test.sh monero-wallet-rpc monero-wallet-rpc:ci ${{ matrix.variant }}

      - name: Test monero-wallet-light
        run: ./bin/smoke_test.sh monero-wallet-light monero-wallet-light:ci ${{ matrix.variant }}
        env:
          DAEMON_IMAGE: monero-daemon-rpc:ci

      - name: Upload the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-tests-logs-${{ matrix.arch }}-${{ matrix.variant }}
          path: build/smoke-tests/*.log
          if-no-files-found: ignore

  stack:
    name: stack ${{ matrix.arch }} ${{ matrix.variant }}
    needs: wait
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]
        variant: [ default, private-testnet ]
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-${{ matrix.arch }}-${{ matrix.variant }}-*
          merge-multiple: true
          path: build/images
          run-id: ${{ inputs.run-id || needs.wait.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Load the images
        run: ./bin/load_images.sh build/images

      - name: Run the pytest tests on a node, a wallet and a light wallet server
        run: ./bin/wallet_light_tests.sh monero-daemon-rpc:ci monero-wallet-rpc:ci monero-wallet-light:ci ${{ matrix.variant }}

      - name: Upload the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-tests-logs-${{ matrix.arch }}-${{ matrix.variant }}
          path: build/tests/logs/*.log
          if-no-files-found: ignore
