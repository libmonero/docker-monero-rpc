name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tests:
        description: Functional tests to run, separated by spaces, all but a few if empty
      run-id:
        description: Build run to take the binaries from
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wait:
    name: wait for build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      run-id: ${{ steps.build.outputs.run-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Wait for the build of the same commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          id=$(./bin/wait_for_run.sh build.yml "$SHA" "$GITHUB_EVENT_NAME")
          echo "run-id=$id" >> "$GITHUB_OUTPUT"

  functional:
    name: ${{ matrix.arch }}
    needs: wait
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: monero-rpc-${{ matrix.arch }}-default-*
          merge-multiple: true
          path: build/binaries
          run-id: ${{ inputs.run-id || needs.wait.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Run functional tests
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          read -ra list <<< "$TESTS"
          ./bin/functional_tests.sh build/binaries "${list[@]}"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-tests-logs-${{ matrix.arch }}
          path: build/functional/tests/functional_tests/*.log
          if-no-files-found: ignore
