x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:

  monerod:
    image: ghcr.io/libmonero/monero-daemon-rpc:${MONERO_TAG:-latest}
    command: [
      "--stagenet",
      "--no-igd",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-bind-port=38081",
      "--confirm-external-bind",
      "--rpc-login=superuser:abctesting123"
    ]
    volumes:
      - monerod_data:/home/monero/.bitmonero
    ports:
      - "38080:38080"
      - "127.0.0.1:38081:38081"
    restart: unless-stopped
    <<: *logging

  monero-wallet-rpc:
    image: ghcr.io/libmonero/monero-wallet-rpc:${MONERO_TAG:-latest}
    command: [
      "--stagenet",
      "--daemon-address=monerod:38081",
      "--daemon-login=superuser:abctesting123",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-bind-port=38083",
      "--confirm-external-bind",
      "--rpc-login=rpc_user:abc123",
      "--wallet-dir=/home/monero/wallets",
      "--log-file=/dev/null"
    ]
    volumes:
      - wallets:/home/monero/wallets
    ports:
      - "127.0.0.1:38083:38083"
    depends_on:
      monerod:
        condition: service_healthy
    restart: unless-stopped
    <<: *logging

volumes:
  monerod_data:
  wallets:
